# Deploy config. DB params are not stored here; pass them when deploying.
version = 0.1

[default.deploy.parameters]
stack_name = "ble-people-tracker"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
# Pass DB at deploy time: sam deploy --parameter-overrides "DBHost=... DBName=ble DBUser=... DBPassword=... DBPort=5432"
confirm_changeset = false
resolve_s3 = true
