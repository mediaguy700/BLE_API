AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BLE People Tracker API - Readers (lat/long) and Events (MAC = person)

Parameters:
  # Set to true to create a PostgreSQL RDS instance in this stack (recommended). False = use your own DB (pass DBHost).
  UseStackPostgres:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Create RDS PostgreSQL in this stack (true) or use external DB (false, then set DBHost)
  DBHost:
    Type: String
    Default: ''
    Description: PostgreSQL host (only when UseStackPostgres=false)
  DBName:
    Type: String
    Default: 'ble'
    Description: Database name (and RDS DB name when UseStackPostgres=true)
  DBUser:
    Type: String
    Default: 'ble'
    Description: Database user (and RDS master username when UseStackPostgres=true)
  DBPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: Database password (only when UseStackPostgres=false for external DB; when true, password is stored in Secrets Manager)
  DBPort:
    Type: String
    Default: '5432'
    Description: PostgreSQL port (ignored when UseStackPostgres=true; RDS uses 5432)
  # Optional: when UseStackPostgres=false and your DB is in a VPC, set these
  VpcSubnetIds:
    Type: String
    Default: ''
    Description: Comma-separated subnet IDs for Lambda (when UseStackPostgres=false and DB in VPC)
  VpcSecurityGroupIds:
    Type: String
    Default: ''
    Description: Comma-separated security group IDs for Lambda (when UseStackPostgres=false and DB in VPC)
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Access-Control-Allow-Origin value (use * or your frontend origin)

Conditions:
  UseStackPostgres: !Equals [!Ref UseStackPostgres, 'true']
  VpcEnabled: !And
    - !Not [!Equals [!Ref UseStackPostgres, 'true']]
    - !Not [!Equals [!Ref VpcSubnetIds, '']]

Globals:
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,X-Api-Key'"
      AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
    Auth:
      ApiKeyRequired: true
      UsagePlan:
        CreateUsagePlan: PER_API
        UsagePlanName: BLEPeopleTrackerUsagePlan
        Description: Usage plan for BLE People Tracker API
        Throttle:
          RateLimit: 500
          BurstLimit: 1000
  Function:
    Timeout: 30
    Runtime: python3.9
    MemorySize: 512
    VpcConfig: !If
      - UseStackPostgres
      - SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      - !If
        - VpcEnabled
        - SecurityGroupIds: !Split [',', !Ref VpcSecurityGroupIds]
          SubnetIds: !Split [',', !Ref VpcSubnetIds]
        - !Ref 'AWS::NoValue'
    Environment:
      Variables:
        DB_HOST: !If [UseStackPostgres, !GetAtt BLEPostgres.Endpoint.Address, !Ref DBHost]
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUser
        DB_PASSWORD: !If [UseStackPostgres, '', !Ref DBPassword]
        DB_SECRET_ARN: !If [UseStackPostgres, !Ref BLEPostgresSecret, '']
        DB_PORT: !If [UseStackPostgres, !GetAtt BLEPostgres.Endpoint.Port, !Ref DBPort]
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  ReadersListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.readers.list_readers
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        ListReaders:
          Type: Api
          Properties:
            Path: /readers
            Method: get
  ReaderGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.readers.get_reader
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        GetReader:
          Type: Api
          Properties:
            Path: /readers/{readerName}
            Method: get
  ReaderEventsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.events.list_reader_events
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        ListReaderEvents:
          Type: Api
          Properties:
            Path: /readers/{readerName}/events
            Method: get
  ReaderCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.readers.create_reader
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        CreateReader:
          Type: Api
          Properties:
            Path: /readers
            Method: post
  ReaderUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.readers.update_reader
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        UpdateReader:
          Type: Api
          Properties:
            Path: /readers/{readerName}
            Method: put
        PatchReader:
          Type: Api
          Properties:
            Path: /readers/{readerName}
            Method: patch
  ReaderDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.readers.delete_reader
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        DeleteReader:
          Type: Api
          Properties:
            Path: /readers/{readerName}
            Method: delete

  EventsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.events.list_events
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        ListEvents:
          Type: Api
          Properties:
            Path: /events
            Method: get
  EventGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.events.get_event
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        GetEvent:
          Type: Api
          Properties:
            Path: /events/{id}
            Method: get
  EventsByPersonFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.events.list_events_by_mac
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        EventsByPerson:
          Type: Api
          Properties:
            Path: /events/person/{mac}
            Method: get
  EventCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.events.create_event
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        CreateEvent:
          Type: Api
          Properties:
            Path: /events
            Method: post
  EventUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.events.update_event
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        UpdateEvent:
          Type: Api
          Properties:
            Path: /events/{id}
            Method: put
        PatchEvent:
          Type: Api
          Properties:
            Path: /events/{id}
            Method: patch
  EventDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.events.delete_event
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Events:
        DeleteEvent:
          Type: Api
          Properties:
            Path: /events/{id}
            Method: delete

  # Invoke once after deploy to apply schema and migrations on stack RDS (when UseStackPostgres=true)
  SchemaRunnerFunction:
    Type: AWS::Serverless::Function
    Condition: UseStackPostgres
    Properties:
      CodeUri: .
      Handler: src.handlers.run_schema.run_schema
      Timeout: 120
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}*'
      Description: Run database/schema.sql and migrations - invoke once after first deploy

  # --- Optional: VPC + RDS PostgreSQL (when UseStackPostgres=true) ---
  BLEVpc:
    Type: AWS::EC2::VPC
    Condition: UseStackPostgres
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: UseStackPostgres
    Properties:
      VpcId: !Ref BLEVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-subnet1'
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: UseStackPostgres
    Properties:
      VpcId: !Ref BLEVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-subnet2'
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseStackPostgres
    Properties:
      GroupDescription: Lambda access for BLE API
      VpcId: !Ref BLEVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-sg'
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseStackPostgres
    Properties:
      GroupDescription: RDS PostgreSQL for BLE API
      VpcId: !Ref BLEVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rds-sg'
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: UseStackPostgres
    Properties:
      DBSubnetGroupDescription: Subnets for BLE PostgreSQL
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-db-subnets'
  # VPC endpoint so Lambda in private subnets can reach Secrets Manager (no NAT required)
  SecretsManagerEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Condition: UseStackPostgres
    Properties:
      GroupDescription: Allow Lambda to reach Secrets Manager VPC endpoint
      VpcId: !Ref BLEVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sm-endpoint-sg'
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseStackPostgres
    Properties:
      VpcId: !Ref BLEVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref SecretsManagerEndpointSG]
  # Password for stack RDS is stored in Secrets Manager (auto-generated); Lambdas read it at runtime
  BLEPostgresSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseStackPostgres
    Properties:
      Name: !Sub '${AWS::StackName}/postgres'
      Description: RDS PostgreSQL master password for BLE People Tracker API
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-postgres-secret'
  BLEPostgres:
    Type: AWS::RDS::DBInstance
    Condition: UseStackPostgres
    DeletionPolicy: Snapshot
    DependsOn: BLEPostgresSecret
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-postgres'
      Engine: postgres
      EngineVersion: '15'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Sub
        - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'
        - { SecretArn: !Ref BLEPostgresSecret }
      DBName: !Ref DBName
      VPCSecurityGroups: [!Ref RDSSecurityGroup]
      DBSubnetGroupName: !Ref DBSubnetGroup
      MultiAZ: false
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-postgres'

  # Production: alarm when API returns 5XX errors
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-Api5xx'
      AlarmDescription: API Gateway 5XX errors - check Lambda and DB connectivity
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiId
          Value: !Ref ServerlessRestApi
        - Name: Stage
          Value: Prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Base URL of the People Tracker API
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
    Export:
      Name: BLEPeopleTrackerApiUrl
  ApiKeyId:
    Description: API Key ID - retrieve the key value in API Gateway console (API keys) or via AWS CLI (get-api-key)
    Value: !Ref ServerlessRestApiApiKey
  UsagePlanId:
    Description: Usage plan ID for this API (for adding more keys)
    Value: !Ref ServerlessRestApiUsagePlan
  DBEndpoint:
    Condition: UseStackPostgres
    Description: RDS PostgreSQL endpoint - run database/schema.sql and migrations after first deploy (from a host that can reach this endpoint, e.g. bastion or Lambda one-off)
    Value: !GetAtt BLEPostgres.Endpoint.Address
  DBPort:
    Condition: UseStackPostgres
    Description: RDS PostgreSQL port
    Value: !GetAtt BLEPostgres.Endpoint.Port
  DBSecretArn:
    Condition: UseStackPostgres
    Description: Secrets Manager secret ARN containing the RDS password (auto-generated)
    Value: !Ref BLEPostgresSecret
  SchemaRunnerFunctionName:
    Condition: UseStackPostgres
    Description: Invoke this Lambda once after first deploy to run schema and migrations - aws lambda invoke --function-name <value> out.json
    Value: !Ref SchemaRunnerFunction
